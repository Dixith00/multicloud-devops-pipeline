name: Multi-Cloud Production CI/CD & DevSecOps Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  PROJECT_NAME: "multicloud-devops-pipeline"
  AWS_REGION: "ap-south-1"
  AWS_ECR_REPO: "multicloud-devops-pipeline-repo"
  AZURE_RESOURCE_GROUP_PREFIX: "rg-multicloud-devops-pipeline"

jobs:
  # ============================================================================
  # Job 1: CI & DevSecOps Quality Gate
  # ============================================================================
  ci-security:
    name: "CI & Security Gate (Lint, Unit Tests, Trivy SAST/SCA)"
    runs-on: ubuntu-latest

    steps:
      - name: Check out source code repository
        uses: actions/checkout@v4

      - name: Set up Python runtime environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "src/requirements.txt"

      - name: Install pinned project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/requirements.txt

      - name: Execute static code analysis and linting (flake8)
        run: |
          # Check critical syntax errors
          flake8 src --count --select=E9,F63,F7,F82 --show-source --statistics
          # Check style and complexity (non-fatal warning mode)
          flake8 src --count --max-complexity=10 --max-line-length=120 --exit-zero --statistics

      - name: Execute automated unit and integration tests (pytest)
        run: |
          PYTHONPATH=src pytest src/tests/ -v --junitxml=test-reports.xml

      - name: Build local container image for DevSecOps vulnerability scan
        run: |
          docker build \
            --file src/Dockerfile \
            --tag ${{ env.PROJECT_NAME }}:${{ github.sha }} \
            src/

      - name: Execute Trivy vulnerability security scanner (Container Image)
        run: |
          echo "Scanning container image for CRITICAL and HIGH vulnerabilities..."
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            --severity CRITICAL,HIGH \
            --exit-code 0 \
            --ignore-unfixed \
            ${{ env.PROJECT_NAME }}:${{ github.sha }} || true

      - name: Scan Filesystem and Infrastructure for Secrets & Misconfigurations
        run: |
          echo "Scanning repository filesystem for misconfigurations and exposed secrets..."
          docker run --rm -v ${{ github.workspace }}:/workspace \
            aquasec/trivy:latest fs \
            --severity CRITICAL,HIGH \
            --exit-code 0 \
            /workspace || true

  # ============================================================================
  # Job 2: Simultaneous Continuous Deployment to Amazon Web Services (AWS)
  # ============================================================================
  deploy-aws:
    name: "Deploy to AWS (ECR & App Runner)"
    needs: [ci-security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Check out source code repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials via IAM Identity
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Authenticate Docker client to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure Amazon ECR Repository Exists
        run: |
          echo "Checking if ECR repository '${AWS_ECR_REPO}' exists..."
          aws ecr describe-repositories --repository-names "${AWS_ECR_REPO}" --region "${AWS_REGION}" >/dev/null 2>&1 || \
          aws ecr create-repository --repository-name "${AWS_ECR_REPO}" --region "${AWS_REGION}" --image-scanning-configuration scanOnPush=true
          echo "ECR repository is ready."

      - name: Build, tag, and publish Docker container image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG_SHA: ${{ github.sha }}
        run: |
          IMAGE_URI_SHA="${ECR_REGISTRY}/${AWS_ECR_REPO}:${IMAGE_TAG_SHA}"
          IMAGE_URI_LATEST="${ECR_REGISTRY}/${AWS_ECR_REPO}:latest"

          echo "Building container from src/Dockerfile..."
          docker build \
            --file src/Dockerfile \
            --tag "${IMAGE_URI_SHA}" \
            --tag "${IMAGE_URI_LATEST}" \
            src/

          echo "Pushing images to Amazon ECR..."
          docker push "${IMAGE_URI_SHA}"
          docker push "${IMAGE_URI_LATEST}"
          echo "Successfully published container to Amazon ECR."

      - name: Trigger AWS App Runner automatic deployment update
        run: |
          echo "Querying App Runner service for ${PROJECT_NAME}-svc..."
          SERVICE_ARN=$(aws apprunner list-services \
            --region "${AWS_REGION}" \
            --query "ServiceSummaryList[?ServiceName=='${PROJECT_NAME}-svc'].ServiceArn" \
            --output text 2>/dev/null || true)

          if [ -n "$SERVICE_ARN" ] && [ "$SERVICE_ARN" != "None" ]; then
            echo "Found active App Runner service: ${SERVICE_ARN}"
            aws apprunner start-deployment \
              --region "${AWS_REGION}" \
              --service-arn "${SERVICE_ARN}"
            echo "Deployment successfully initiated for AWS App Runner."
          else
            echo "Notice: App Runner service not yet running. Image is ready in ECR: ${AWS_ECR_REPO}:latest"
          fi

  # ============================================================================
  # Job 3: Simultaneous Continuous Deployment to Microsoft Azure
  # ============================================================================
  deploy-azure:
    name: "Deploy to Azure (ACR & Linux Web App)"
    needs: [ci-security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Check out source code repository
        uses: actions/checkout@v4

      - name: Authenticate to Microsoft Azure via Service Principal
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Retrieve Azure ACR Credentials and Login Server
        id: acr-info
        run: |
          ACR_NAME="${{ secrets.AZURE_ACR_NAME }}"
          echo "Fetching credentials for ACR: ${ACR_NAME}..."
          LOGIN_SERVER=$(az acr show --name "${ACR_NAME}" --query "loginServer" --output tsv 2>/dev/null || echo "")

          if [ -z "${LOGIN_SERVER}" ]; then
            echo "Notice: ACR registry '${ACR_NAME}' does not exist yet. Run 'terraform apply' to provision it."
            echo "has_acr=false" >> $GITHUB_OUTPUT
          else
            ADMIN_USER=$(az acr credential show --name "${ACR_NAME}" --query "username" --output tsv)
            ADMIN_PASS=$(az acr credential show --name "${ACR_NAME}" --query "passwords[0].value" --output tsv)

            echo "has_acr=true" >> $GITHUB_OUTPUT
            echo "login_server=${LOGIN_SERVER}" >> $GITHUB_OUTPUT
            echo "admin_username=${ADMIN_USER}" >> $GITHUB_OUTPUT
            echo "::add-mask::${ADMIN_PASS}"
            echo "admin_password=${ADMIN_PASS}" >> $GITHUB_OUTPUT
          fi

      - name: Authenticate Docker CLI to Azure Container Registry
        if: steps.acr-info.outputs.has_acr == 'true'
        uses: azure/docker-login@v2
        with:
          login-server: ${{ steps.acr-info.outputs.login_server }}
          username: ${{ steps.acr-info.outputs.admin_username }}
          password: ${{ steps.acr-info.outputs.admin_password }}

      - name: Build, tag, and publish Docker image to Azure Container Registry
        if: steps.acr-info.outputs.has_acr == 'true'
        env:
          LOGIN_SERVER: ${{ steps.acr-info.outputs.login_server }}
          IMAGE_TAG_SHA: ${{ github.sha }}
        run: |
          IMAGE_URI_SHA="${LOGIN_SERVER}/${PROJECT_NAME}:${IMAGE_TAG_SHA}"
          IMAGE_URI_LATEST="${LOGIN_SERVER}/${PROJECT_NAME}:latest"

          echo "Building image from src/Dockerfile..."
          docker build \
            --file src/Dockerfile \
            --tag "${IMAGE_URI_SHA}" \
            --tag "${IMAGE_URI_LATEST}" \
            src/

          echo "Pushing images to Azure Container Registry..."
          docker push "${IMAGE_URI_SHA}"
          docker push "${IMAGE_URI_LATEST}"
          echo "Successfully published container to Azure Container Registry."

      - name: Redeploy container image to Azure Linux Web App
        if: steps.acr-info.outputs.has_acr == 'true'
        run: |
          LOGIN_SERVER="${{ steps.acr-info.outputs.login_server }}"
          IMAGE_LATEST="${LOGIN_SERVER}/${PROJECT_NAME}:latest"

          APP_NAME=$(az webapp list \
            --query "[?starts_with(name, 'app-${PROJECT_NAME}')].name | [0]" \
            --output tsv 2>/dev/null || true)
          RESOURCE_GROUP=$(az webapp list \
            --query "[?starts_with(name, 'app-${PROJECT_NAME}')].resourceGroup | [0]" \
            --output tsv 2>/dev/null || true)

          if [ -n "$APP_NAME" ] && [ "$APP_NAME" != "None" ]; then
            az webapp config container set \
              --name "${APP_NAME}" \
              --resource-group "${RESOURCE_GROUP}" \
              --docker-custom-image-name "${IMAGE_LATEST}"
            az webapp restart --name "${APP_NAME}" --resource-group "${RESOURCE_GROUP}"
            echo "Azure Web App successfully updated."
          else
            echo "Notice: Azure Web App not running yet. Image pushed to ACR: ${IMAGE_LATEST}"
          fi
